<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>My Hobby Cards</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #384e65;
    }
    h1 {
        text-align: center;
        color: orange;
        margin-bottom: 30px;
        padding: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        font-size: 30px;
    }
    .hobby-card {
        border-radius: 10px;
        font-size: 18px;
        padding: 20px;
        margin-bottom: 20px;
        border: 4px solid #ff0000;
        color: #170975;
    }
    .hobby-card h3 {
        color: #e4dd07;
        margin-bottom: 10px;
    }
    
  </style>
</head>
<body>
    <h1>My Hobby Cards</h1>
    <div class="container">
        <div class="row">
           <div class="col-12 col-md-6 col-lg-4"></div>
               <div class="hobby-card">
                <h3>Cricket</h3>
                <p>I play cricket in my free time.</p>
               </div>
        
        </div>
    </div>
    <div class="container" >
        <div class="row">
           <div class="col-12 col-md-6 col-lg-4"></div>
               <div class="hobby-card">
                <h3>Football</h3>
                <p>I play football with my friends.</p>
               </div>
        </div>
    </div>

    <div class="container" >
        <div class="row">
           <div class="col-12 col-md-6 col-lg-4"></div>
               <div class="hobby-card">
                <h3>Reading</h3>
                <p>I enjoy reading books in my leisure time.</p>
               </div>
        </div>
    </div>
</body>
</html>
