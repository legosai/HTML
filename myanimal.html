<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Fact Panel</title>
    <style>
        body {
            background-color: forestgreen;
            font-family: arial, sans-serif;

        }
        .fact-file {
          background-color: lightyellow;
          color: darkslategrey;
          padding: 26px;
          width: 260px;
          border: 4px solid forestgreen;
          margin: 30px;

        }
         .animal-name  {
            color: forestgreen;
            font-size: 22px;
         }
         .detail{
            color: darkslategrey;
             
        }
        .cool-fact {
            color: darkorange;
            font-style: italic;
        }

    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia </p>
        <p class="detail">Diet: Goats,Deer,and Wild sheep</p>
        <p class="cool-fact" >Cool Fact: Can Leap up to 15 meters in one jump</p>
    </div>
</body>
</html>
