<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Superhero Card</title>
    <style>
        body {
           background-color: darkblue;
           color: white;
           font-family: arial, sans-sherif;

        }
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;

        }
        .tagline {
            font-style: italic ;
            color: lightblue;
            text-transform: capitalize;
        }
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }
        .power {
            font-weight: bold;
            color: lightgreen;

        }
        .weakness {
            text-decoration: line-through;
            color: gray;
        }
        .badge {
            font-size: 20px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }
        .made-by {
            color: coral;
            font-style: italic;
        }

    </style>
</head>
<body>
    <h1 class="hero-name">Thunder KId</h1>
    <p class="tagline"the most powerful hero in the school></p>
    <h2 class="label">super powers</h2>
    <p class="power">Can Lift a School bus</p>
    <p class="power" >Can run faster than a Cheetah</p>
    <h2 class="label">Weaknesses</h2>
    <p class="weakness">Maths Homework</p>
    <p class="weakness">Brocolli</p>
    <p class="badge">Top Hero</p>
    <p class="made-by">Created by Sai</p>
</body>
</html>
